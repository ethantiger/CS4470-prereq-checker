name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build Electron app
      run: npm run make

    - name: List build outputs
      shell: bash
      run: |
        echo "Build artifacts:"
        ls -R out/make

    # Upload all Squirrel output — RELEASES, .nupkg, and .exe are all required for auto-updates
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-squirrel
        path: out/make/squirrel.windows/

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-squirrel
        path: ./artifacts

    - name: Display structure of downloaded files
      run: ls -R ./artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        # Include all Squirrel files: RELEASES manifest, .nupkg delta packages, and setup .exe
        files: |
          ./artifacts/**/*.exe
          ./artifacts/**/*.nupkg
          ./artifacts/**/RELEASES
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
